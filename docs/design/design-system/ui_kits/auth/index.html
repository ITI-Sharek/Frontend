<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Share-k — Auth</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  html, body { margin: 0; height: 100%; font-family: var(--font-sans); background: var(--background); }
  #root { min-height: 100vh; display: flex; flex-direction: column; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="./LoginScreen.jsx"></script>
<script type="text/babel" src="./ForgotPasswordScreen.jsx"></script>
<script type="text/babel" src="./RegisterScreen.jsx"></script>
<script type="text/babel">
const ds = window.ShareKDesignSystem_b6d289;
const { AuthHeader, SiteFooter } = ds;

function App() {
  const [screen, setScreen] = React.useState("login");
  const [dark, setDark] = React.useState(false);

  React.useEffect(() => {
    document.documentElement.classList.toggle("dark", dark);
  }, [dark]);

  const Screen = { login: window.LoginScreen, register: window.RegisterScreen, forgot: window.ForgotPasswordScreen }[screen];

  return (
    <React.Fragment>
      <AuthHeader />
      <main style={{ flex: 1, display: "flex", alignItems: "center", padding: "48px 24px", boxSizing: "border-box" }}>
        <Screen ds={ds} onNavigate={setScreen} />
      </main>
      <SiteFooter />
      <button
        onClick={() => setDark((d) => !d)}
        style={{ position: "fixed", bottom: 16, insetInlineStart: 16, border: "1px solid var(--border)", background: "var(--card)", color: "var(--foreground)", borderRadius: 8, padding: "8px 12px", fontFamily: "var(--font-mono)", fontSize: 12, cursor: "pointer" }}
      >
        {dark ? "☀ Light" : "● Dark"}
      </button>
    </React.Fragment>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
