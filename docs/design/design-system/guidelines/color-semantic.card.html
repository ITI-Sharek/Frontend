<!-- @dsCard group="Colors" viewport="700x120" name="Semantic Tokens" -->
<html><head><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;font-family:var(--font-mono);font-size:12px;background:var(--background);color:var(--foreground)}
table{width:100%;border-collapse:collapse;padding:16px;box-sizing:border-box}
td{padding:8px 12px;border-bottom:1px solid var(--border)}
.dot{width:14px;height:14px;border-radius:4px;display:inline-block;margin-right:8px;vertical-align:middle;border:1px solid var(--border)}
</style></head><body>
<table>
<tr><td><span class="dot" style="background:var(--primary)"></span>--primary</td><td><span class="dot" style="background:var(--card)"></span>--card</td><td><span class="dot" style="background:var(--destructive)"></span>--destructive</td></tr>
<tr><td><span class="dot" style="background:var(--header-bg)"></span>--header-bg</td><td><span class="dot" style="background:var(--footer-bg)"></span>--footer-bg</td><td><span class="dot" style="background:var(--input-bg)"></span>--input-bg</td></tr>
</table>
</body></html>
