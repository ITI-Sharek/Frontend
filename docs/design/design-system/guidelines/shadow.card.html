<!-- @dsCard group="Spacing" viewport="700x260" name="Shadow / Elevation" -->
<html><head><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--background);padding:24px;box-sizing:border-box;display:flex;gap:24px;font-family:var(--font-mono);font-size:11px;color:var(--muted-foreground)}
.c{width:150px;height:150px;border-radius:12px;background:var(--card);border:1px solid var(--border);display:flex;align-items:flex-end;padding:10px;box-sizing:border-box}</style></head><body>
<div class="c" style="box-shadow:0 4px 6px -1px rgba(0,0,0,0.05),0 2px 4px -2px rgba(0,0,0,0.05)">Card (light)</div>
<div class="c" style="box-shadow:0 10px 15px -3px rgba(45,212,191,0.2),0 4px 6px -4px rgba(45,212,191,0.2)">Primary btn glow</div>
</body></html>
