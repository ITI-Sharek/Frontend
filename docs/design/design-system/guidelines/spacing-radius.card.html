<!-- @dsCard group="Spacing" viewport="700x160" name="Radius Scale" -->
<html><head><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--background);padding:20px;box-sizing:border-box;display:flex;gap:16px;font-family:var(--font-mono);font-size:11px;color:var(--muted-foreground)}
.b{width:120px;height:90px;border:1px solid var(--border);display:flex;align-items:flex-end;padding:6px;box-sizing:border-box}</style></head><body>
<div class="b" style="border-radius:var(--radius-card)">--radius-card</div>
<div class="b" style="border-radius:var(--radius-input)">--radius-input</div>
<div class="b" style="border-radius:var(--radius-social)">--radius-social</div>
<div class="b" style="border-radius:999px">pill (chips)</div>
</body></html>
